<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Flashcards AI</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <!-- La barra de estado, del color del fondo de la app. -->
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <script>
    // Tema oscuro antes de que cargue la app, sin destello claro. Mismo ajuste, clase y colores que ThemeService. iOS lee
    // el estilo de la barra de estado al abrir la app: tiene que estar antes.
    try {
      var theme = localStorage.getItem('flashcards-ai.theme');
      if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('theme-dark');
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1220');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'black');
      }
    } catch (e) {}
  </script>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/icon/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Flashcards AI" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
</head>

<body>
  <app-root></app-root>
  <noscript>Activa JavaScript para usar esta aplicación.</noscript>
</body>

</html>
