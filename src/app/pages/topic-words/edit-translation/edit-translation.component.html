<ion-header class="card-modal-header ion-no-border">
  <span class="card-modal-handle" aria-hidden="true"></span>
  <ion-toolbar>
    <h2 class="card-modal-title">
      <ion-icon name="language-outline" aria-hidden="true"></ion-icon>
      <span lang="en">{{ word }}</span>
    </h2>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="card-modal-form">
    <label class="card-modal-field">
      <span class="card-modal-label">Traducción al español</span>
      <input #input class="card-modal-input" type="text" [(ngModel)]="value" placeholder="Traducción" maxlength="80"
        autocapitalize="off" enterkeyhint="done" (keydown.enter)="save()" />
    </label>
  </div>
</ion-content>

<ion-footer class="card-modal-footer ion-no-border">
  <button type="button" class="card-modal-btn card-modal-btn-cancel" (click)="cancel()">Cancelar</button>
  <button type="button" class="card-modal-btn card-modal-btn-save" [disabled]="!canSave" (click)="save()">Guardar</button>
</ion-footer>
