<div class="session-summary">
  <span class="title">¡Sesión terminada!</span>

  <div class="stats">
    <div class="stat knew">
      <strong>{{ summary.knew }}</strong>
      <span>La sé</span>
    </div>
    <div class="stat hard">
      <strong>{{ summary.hard }}</strong>
      <span>Difíciles</span>
    </div>
  </div>

  <p class="message">{{ message }}</p>

  <ion-button *ngIf="summary.hard" expand="block" size="large" class="review-btn" (click)="reviewHard.emit()">
    Repasar difíciles ({{ summary.hard }})
  </ion-button>
  <ion-button expand="block" fill="clear" class="exit-btn" (click)="exit.emit()">Elegir otro tema</ion-button>
  <ion-button fill="clear" size="small" class="undo-btn" (click)="undo.emit()">
    <ion-icon slot="start" name="arrow-undo-outline" aria-hidden="true"></ion-icon>
    Volver a la última tarjeta
  </ion-button>
</div>
