  <meta name="theme-color" content="#f5f7fb">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Tema oscuro antes de que cargue la app, sin destello claro. Mismo ajuste, clase y colores que ThemeService. iOS lee
    // el estilo de la barra de estado al abrir la app: tiene que estar antes.
    try {
      var theme = localStorage.getItem('flashcards-ai.theme');
      if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('theme-dark');
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1220');
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'black');
      }
    } catch (e) {}
  </script>
